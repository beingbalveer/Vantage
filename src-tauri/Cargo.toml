[package]
name = "vantage"
version = "0.1.0"
description = "A lightweight multi-repo Git desktop client, read-only code viewer, and terminal workspace"
authors = ["Balveer Dhanoriya <https://github.com/beingbalveer>"]
license = "MIT"
repository = "https://github.com/beingbalveer/vantage"
homepage = "https://github.com/beingbalveer/vantage#readme"
readme = "../README.md"
keywords = ["git", "desktop", "diff", "tauri", "svelte"]
categories = ["development-tools"]
edition = "2021"

[lib]
name = "vantage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
notify = "6"
similar = { version = "2", features = ["inline"] }
chrono = { version = "0.4", features = ["serde"] }
dunce = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
dirs = "5"
which = "6"
rfd = "0.15"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
