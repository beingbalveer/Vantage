name: Publish Release

# One-off helper: the local `gh` session only has read access to this repo, so
# publishing the draft created by the Release workflow runs here with the
# workflow token instead.
on:
  push:
    branches: [staging]
    paths:
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.4.0
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
