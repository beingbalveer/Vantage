name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build native app
        run: cargo build --release -p vantage

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/vantage dist/
          cd dist
          zip -r "vantage-${GITHUB_REF_NAME}-macos-arm64.zip" vantage

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
