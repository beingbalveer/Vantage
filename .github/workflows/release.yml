name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-macos:
    name: Build, sign and publish
    # Pinned image on Apple silicon: the runner is arm64 and cross-compiles the
    # Intel slice, so the DMG is universal.
    runs-on: macos-15
    permissions:
      contents: write
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # A publishable release must be Developer ID signed and notarized. A
      # missing credential fails the tag build here, before anything is built
      # or uploaded, instead of silently shipping an ad-hoc bundle. The
      # ALLOW_ADHOC_RELEASE repository variable is a deliberate escape hatch
      # for previews and is surfaced in the release notes and step summary.
      - name: Enforce the signing and notarization policy
        id: signing-policy
        env:
          ALLOW_ADHOC_RELEASE: ${{ vars.ALLOW_ADHOC_RELEASE }}
        run: |
          missing=()
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID \
            APPLE_APP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          {
            echo "### Release signing policy"
            echo
            echo "A \`v*\` tag must be signed with a Developer ID and notarized."
            echo "Missing credentials fail this job unless the repository"
            echo "variable \`ALLOW_ADHOC_RELEASE\` is set to \`true\`."
            echo
          } >>"$GITHUB_STEP_SUMMARY"

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "mode=signed" >>"$GITHUB_OUTPUT"
            echo "**Result:** signed and notarized." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$ALLOW_ADHOC_RELEASE" = "true" ]; then
            echo "mode=adhoc" >>"$GITHUB_OUTPUT"
            {
              echo "**Result:** preview (\`ALLOW_ADHOC_RELEASE=true\`)."
              echo
              echo "Missing: \`${missing[*]}\`. The build does not meet the"
              echo "release signing policy; it is published as a prerelease"
              echo "without a cask, and the in-repo cask stays on the last"
              echo "notarized release."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::warning::Publishing a preview missing signing/notarization credentials: ${missing[*]}"
            exit 0
          fi

          {
            echo "**Result:** blocked."
            echo
            echo "Missing: \`${missing[*]}\`."
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::error::Missing signing/notarization credentials: ${missing[*]}"
          echo "Refusing to publish an unnotarized release. Configure the Apple"
          echo "secrets, or set the repository variable ALLOW_ADHOC_RELEASE=true"
          echo "to deliberately publish a preview build."
          exit 1

      - name: Install Rust with both Apple targets
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # yamllint disable-line rule:line-length
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # A tag that disagrees with the crate version ships a bundle whose About
      # panel and CFBundleShortVersionString both lie, so fail before building.
      - name: Check the tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag workspace=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match workspace version $version"
            exit 1
          fi

      # Imported whenever the certificate exists; the policy step guarantees it
      # for compliant releases and the ad-hoc opt-in path skips it.
      - name: Import the Developer ID certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode >certificate.p12
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import certificate.p12 -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN"
          rm certificate.p12

      - name: Build universal release binary
        run: |
          cargo build --release -p vantage --locked \
            --target aarch64-apple-darwin
          cargo build --release -p vantage --locked \
            --target x86_64-apple-darwin

      - name: Package app bundle, DMG, cask and checksums
        run: ./scripts/bundle-macos.sh "$GITHUB_REF_NAME"

      - name: Verify the artifacts
        env:
          RELEASE_MODE: ${{ steps.signing-policy.outputs.mode }}
        run: |
          plutil -lint dist/Vantage.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/Vantage.app
          lipo -archs dist/Vantage.app/Contents/MacOS/vantage
          hdiutil attach -nobrowse -readonly dist/Vantage_*_universal.dmg
          test -d /Volumes/Vantage/Vantage.app
          hdiutil detach /Volumes/Vantage
          (cd dist && shasum -a 256 -c SHA256SUMS)
          if [ "$RELEASE_MODE" = "signed" ]; then
            spctl --assess --type execute --verbose=2 dist/Vantage.app
          else
            echo "::warning::Preview build: skipping spctl; Gatekeeper may reject this build"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ steps.signing-policy.outputs.mode }}
        run: |
          if [ "$RELEASE_MODE" = "adhoc" ]; then
            cat >release-notes.md <<'EOF'
          > [!WARNING]
          > This preview release did not complete the full Developer ID
          > signing and notarization pipeline. macOS may refuse to open it,
          > so it is published only to exercise the tag pipeline and must
          > not be redistributed as a normal install. It ships without a
          > Homebrew cask; use the latest stable release instead.
          EOF
            title="Vantage $GITHUB_REF_NAME (preview, not notarized)"
            args=(--notes-file release-notes.md --prerelease --latest=false)
            assets=(dist/Vantage_*_universal.dmg dist/Vantage_*_universal.app.zip dist/SHA256SUMS)
          else
            title="Vantage $GITHUB_REF_NAME"
            args=(--generate-notes)
            assets=(dist/Vantage_*_universal.dmg dist/Vantage_*_universal.app.zip dist/SHA256SUMS dist/vantage.rb)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$title" \
            "${args[@]}" \
            "${assets[@]}"

      # Keeps the in-repo cask pinned to the build that was just published.
      # A no-op when main already moved past this tag. Never runs for an ad-hoc
      # preview: the stable cask stays on the last notarized release.
      - name: Sync the cask back to main
        if: steps.signing-policy.outputs.mode == 'signed'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p Casks
          cp dist/vantage.rb Casks/vantage.rb
          git add Casks/vantage.rb
          if git diff --cached --quiet -- Casks/vantage.rb; then
            echo "cask already current"
            exit 0
          fi
          gh auth setup-git
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "$bot"
          git commit -m "chore(cask): pin $GITHUB_REF_NAME"
          git push origin "HEAD:main"
