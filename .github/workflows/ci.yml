name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GPUI links against the system windowing and font libraries on Linux,
      # and `cargo test` builds the app binary, so these are needed to link.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust unit tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-app:
    name: Build & package app (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build Vantage (debug)
        run: cargo build -p vantage --locked

      # The release job runs the same script, so a broken bundle or DMG fails
      # here instead of on a tag.
      - name: Build Vantage (release)
        run: cargo build --release -p vantage --locked

      - name: Package app bundle and DMG
        run: ./scripts/bundle-macos.sh

      - name: Verify the bundle
        run: |
          plutil -lint dist/Vantage.app/Contents/Info.plist
          codesign --verify --deep --strict dist/Vantage.app
          lipo -archs dist/Vantage.app/Contents/MacOS/vantage
          hdiutil attach -nobrowse -readonly dist/Vantage_*_arm64.dmg
          test -d /Volumes/Vantage/Vantage.app
          hdiutil detach /Volumes/Vantage
