name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # GPUI links against the system windowing and font libraries on Linux,
      # and `cargo test` builds the app binary, so these are needed to link.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable  # yamllint disable-line rule:line-length
        with:
          toolchain: stable
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "."

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust unit tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  package-app:
    name: Package app (macos-14)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust with both Apple targets
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable  # yamllint disable-line rule:line-length
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "."

      - name: Build Vantage (debug)
        run: cargo build -p vantage --locked

      # Same two builds and the same script the release job runs, so a broken
      # bundle, DMG or cask fails here instead of on a tag.
      - name: Build universal release binaries
        run: |
          cargo build --release -p vantage --locked \
            --target aarch64-apple-darwin
          cargo build --release -p vantage --locked \
            --target x86_64-apple-darwin

      - name: Package app bundle, DMG, cask and checksums
        run: ./scripts/bundle-macos.sh

      - name: Verify the artifacts
        run: |
          plutil -lint dist/Vantage.app/Contents/Info.plist
          codesign --verify --deep --strict dist/Vantage.app
          lipo -archs dist/Vantage.app/Contents/MacOS/vantage
          hdiutil attach -nobrowse -readonly dist/Vantage_*_universal.dmg
          test -d /Volumes/Vantage/Vantage.app
          hdiutil detach /Volumes/Vantage
          (cd dist && shasum -a 256 -c SHA256SUMS)
