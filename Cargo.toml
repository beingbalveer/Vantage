[workspace]
resolver = "2"
members = ["crates/vantage-core", "crates/vantage"]

# gpui's HTTP client pulls in xattr 0.2.3, which references libc::ENOATTR.
# libc 0.2.190 removed that constant on Linux, so the vendored copy maps it
# to ENODATA (the same value) there.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/beingbalveer/vantage"

# Long-running desktop UI: keep our code quick to build, retain line tables for
# useful backtraces, and leave third-party debug info out of the dev profile.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 1
