[package]
name = "vantage"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Vantage — native GPUI repository dashboard"

[dependencies]
gpui = "0.2.2"
vantage-core = { path = "../vantage-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
