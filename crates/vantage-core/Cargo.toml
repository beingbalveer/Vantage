[package]
name = "vantage-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Vantage's git engine: runner, status, log, refs, diffs, watching and state persistence"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the runtime, process, filesystem, sync, time and I/O features this
# engine uses. Avoid `full`, which also compiles networking, signals and other
# unused sub-dependencies.
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "sync",
    "time",
    "io-util",
] }
notify = "6"
similar = { version = "2", features = ["inline"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "5"
dunce = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
which = "6"
